<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostgreSQL Datenbank-Ansicht</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; background: #f4f4f9; }
        h1 { color: #333; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, button { padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .delete-btn { background: #dc3545; padding: 5px 10px; }
        .delete-btn:hover { background: #a71d2a; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #007bff; color: white; }
    </style>
</head>
<body>

    <h1>PostgreSQL Datenbank-Verwaltung</h1>

    <!-- Formular für neue Einträge -->
    <div class="card">
        <h3>Neuen Eintrag speichern</h3>
        <input type="text" id="name" placeholder="Name" required>
        <input type="email" id="email" placeholder="E-Mail" required>
        <input type="number" id="alter" placeholder="Alter" min="1" max="120" required>
        <input type="text" id="nachricht" placeholder="Nachricht" required>
        <button onclick="eintragHinzufuegen()">Speichern</button>
    </div>

    <!-- Tabelle zur Anzeige der PostgreSQL-Daten -->
    <div class="card">
        <h3>Aktuelle Einträge in PostgreSQL</h3>
        <button onclick="datenLaden()">Aktualisieren</button>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>E-Mail</th>
                    <th>Alter</th>
                    <th>Nachricht</th>
                    <th>Aktion</th>
                </tr>
            </thead>
            <tbody id="tabellen-inhalt">
                <tr><td colspan="6">Lade Daten...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000/api/eintraege"; // FastAPI-Endpunkt      
        const API_KEY = "123"; // Muss mit deinem FastAPI-Key übereinstimmen

        // 1. Daten aus PostgreSQL über FastAPI laden
        async function datenLaden() {
            const tbody = document.getElementById("tabellen-inhalt");
            try {
                const response = await fetch(API_URL, {
                    headers: { "X-API-Key": API_KEY }
                });
                const daten = await response.json();
                
                tbody.innerHTML = "";
                if (daten.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='6'>Keine Einträge vorhanden.</td></tr>";
                    return;
                }

                daten.forEach(eintrag => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${eintrag.id}</td>
                            <td>${eintrag.name}</td>
                            <td>${eintrag.email}</td>
                            <td>${eintrag.alter}</td>
                            <td>${eintrag.nachricht}</td>
                            <td><button class="delete-btn" onclick="eintragLoeschen(${eintrag.id})">Löschen</button></td>
                        </tr>
                    `;
                });
            } catch (error) {
                tbody.innerHTML = "<tr><td colspan='6' style='color:red;'>Fehler: Läuft der FastAPI-Server?</td></tr>";
            }
        }

        // 2. Neuen Eintrag an FastAPI senden
        async function eintragHinzufuegen() {
            const neuerEintrag = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                alter: parseInt(document.getElementById("alter").value),
                nachricht: document.getElementById("nachricht").value
            };

            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-API-Key": API_KEY
                },
                body: JSON.stringify(neuerEintrag)
            });

            if (response.ok) {
                document.getElementById("name").value = "";
                document.getElementById("email").value = "";
                document.getElementById("alter").value = "";
                document.getElementById("nachricht").value = "";
                datenLaden(); // Tabelle neu laden
            } else {
                alert("Fehler beim Speichern! Bitte alle Felder korrekt ausfüllen.");
            }
        }

        // 3. Eintrag löschen
        async function eintragLoeschen(id) {
            await fetch(`${API_URL}/${id}`, {
                method: "DELETE",
                headers: { "X-API-Key": API_KEY }
            });
            datenLaden();
        }

        // Beim Öffnen der Seite direkt laden
        datenLaden();
    </script>
</body>
</html>
